name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check every source file
        run: |
          for f in $(find sentinel.js lib test -name '*.js' | sort); do
            echo "checking $f"
            node --check "$f"
          done
      - name: Unit tests
        run: npm test
      - name: CLI smoke (boots + core commands)
        run: |
          node sentinel.js --version
          node sentinel.js uuid
          node sentinel.js hash test
